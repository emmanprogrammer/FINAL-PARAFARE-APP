name: parafare
version: 1.0.0+1
publish_to: none

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  riverpod: ^2.6.1
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  flutter_map: ^7.0.2
  flutter_map_pmtiles: ^1.0.2
  maplibre_gl: ^0.21.0
  latlong2: ^0.9.1
  shared_preferences: ^2.5.3
  geolocator: ^12.0.0
  permission_handler: ^11.4.0
  csv: ^6.0.0
  intl: ^0.20.2
  path_provider: ^2.1.5

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/map/gensan.pmtiles
    - assets/map/style.json
    - assets/graph/gensan_graph.json
